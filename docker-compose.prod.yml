# ============================================
# Spaceship — Production Docker Compose Stack
# ============================================
# Usage: docker compose -f docker-compose.prod.yml up -d
# Requires a .env.production file with all secrets.
#
# For CI/CD deploy, the deploy script sets IMAGE env vars:
#   BACKEND_IMAGE=ghcr.io/owner/saas-ecom/backend:sha
#   DASHBOARD_IMAGE=ghcr.io/owner/saas-ecom/dashboard:sha
#   STOREFRONT_IMAGE=ghcr.io/owner/saas-ecom/storefront:sha

name: spaceship

# P1-C: shared log-rotation policy. Without this Docker's json-file driver
# grows each service's log unbounded and can fill the host disk. 10m × 3 files
# = 30MB cap per service.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # —— Database ——
  postgres:
    image: postgres:17-alpine
    container_name: spaceship_postgres
    restart: unless-stopped
    networks:
      - spaceship_net
    # PostgreSQL port intentionally NOT exposed to host in production
    # Access via internal Docker network only
    environment:
      POSTGRES_USER: ${DB_USER:-spaceship}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-spaceship}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging: *logging
    mem_reservation: 256m
    mem_limit: 1g
    cpus: 1.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-spaceship}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # —— Cache / Queue backend ——
  redis:
    image: redis:7-alpine
    container_name: spaceship_redis
    restart: unless-stopped
    networks:
      - spaceship_net
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --appendfsync everysec
    # Redis port intentionally NOT exposed to host in production
    # Access via internal Docker network only
    # P1-C: AOF (appendonly + everysec fsync) persists BullMQ job state and
    # cache writes across Redis restarts so queued orders/emails/webhooks aren't
    # lost on a crash. RDB snapshots alone can lose up to minutes of data.
    volumes:
      - redis_data:/data
    logging: *logging
    mem_reservation: 128m
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # —— Database Migration ——
  migrate:
    image: ${BACKEND_IMAGE:-saas-ecom-backend:prod}
    container_name: spaceship_migrate
    networks:
      - spaceship_net
    environment:
      NODE_ENV: production
    env_file:
      - .env.production
    command: ["sh", "-c", "timeout 180 node apps/backend/dist/migrate.js"]
    # P1-C: busybox `timeout` makes a hung migration fail fast (exit 124) so
    # the deploy can't block indefinitely waiting on migrate; backend only
    # starts when migrate completes successfully (service_completed_successfully).
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    stop_grace_period: 120s
    logging: *logging
    mem_reservation: 128m
    mem_limit: 512m
    cpus: 0.5

  # —— Scheduled off-host backup (pg_dump -> S3) ——
  backup:
    image: ${BACKEND_IMAGE:-saas-ecom-backend:prod}
    container_name: spaceship_backup
    restart: unless-stopped
    networks:
      - spaceship_net
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      # P1-C: prune backups older than N days so S3 cost stays bounded.
      # Override per-deploy; 30-day default.
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    # P1-C: a sleep loop (not crond) keeps this root-free — it runs as the
    # image's non-root nodejs user. `timeout 1800` guards a wedged pg_dump;
    # one backup runs on start, then every 24h. Drift of a few minutes per
    # cycle is acceptable for daily backups.
    command: ["sh", "-c", "while true; do timeout 1800 node apps/backend/dist/scripts/backup.js; sleep 86400; done"]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging
    mem_reservation: 128m
    mem_limit: 512m
    cpus: 0.5
    stop_grace_period: 60s

  # —— Backend API ——
  backend:
    image: ${BACKEND_IMAGE:-saas-ecom-backend:prod}
    container_name: spaceship_backend
    restart: unless-stopped
    networks:
      - spaceship_net
    ports:
      - "127.0.0.1:3000:3000"
    logging: *logging
    mem_reservation: 384m
    mem_limit: 1g
    cpus: 1.5
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 5
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
        max_attempts: 3

  # —— Dashboard (SvelteKit SSR) ——
  dashboard:
    image: ${DASHBOARD_IMAGE:-saas-ecom-dashboard:prod}
    container_name: spaceship_dashboard
    restart: unless-stopped
    networks:
      - spaceship_net
    ports:
      - "127.0.0.1:3001:3001"
    logging: *logging
    mem_reservation: 128m
    mem_limit: 512m
    cpus: 0.5
    environment:
      NODE_ENV: production
      PORT: 3001
      API_BASE_URL: http://spaceship_backend:3000
    env_file:
      - .env.production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
        max_attempts: 3

  # —— Landing (Marketing Site) ——
  landing:
    image: ${LANDING_IMAGE:-saas-ecom-landing:prod}
    container_name: spaceship_landing
    restart: unless-stopped
    networks:
      - spaceship_net
    ports:
      - "127.0.0.1:3004:3004"
    logging: *logging
    mem_reservation: 128m
    mem_limit: 512m
    cpus: 0.5
    environment:
      NODE_ENV: production
      PORT: 3004
      API_BASE_URL: http://spaceship_backend:3000
    env_file:
      - .env.production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3004/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
        max_attempts: 3

  # —— Storefront (SvelteKit SSR) ——
  storefront:
    image: ${STOREFRONT_IMAGE:-saas-ecom-storefront:prod}
    container_name: spaceship_storefront
    restart: unless-stopped
    networks:
      - spaceship_net
    ports:
      - "127.0.0.1:3002:3002"
    logging: *logging
    mem_reservation: 128m
    mem_limit: 512m
    cpus: 0.5
    environment:
      NODE_ENV: production
      PORT: 3002
      # P1-C: BFF proxy (/api/[...path]) falls back to http://localhost:3000
      # when this is unset — inside the container that is the storefront itself,
      # so all API calls would fail. Point at the backend on the internal net.
      API_BASE_URL: http://spaceship_backend:3000
    env_file:
      - .env.production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
        max_attempts: 3

  # —— Food Storefront (SvelteKit SSR) ——
  storefront-food:
    image: ${STOREFRONT_FOOD_IMAGE:-saas-ecom-storefront-food:prod}
    container_name: spaceship_storefront_food
    restart: unless-stopped
    networks:
      - spaceship_net
    ports:
      - "127.0.0.1:3003:3003"
    logging: *logging
    mem_reservation: 128m
    mem_limit: 512m
    cpus: 0.5
    environment:
      NODE_ENV: production
      PORT: 3003
      # P1-C: BFF proxy falls back to http://localhost:3000 when unset — inside
      # the container that is the storefront itself. Point at the backend.
      API_BASE_URL: http://spaceship_backend:3000
    env_file:
      - .env.production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3003/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
        max_attempts: 3

  # —— Reverse Proxy + SSL (Caddy) ——
  caddy:
    image: caddy:2-alpine
    container_name: spaceship_caddy
    restart: unless-stopped
    networks:
      - spaceship_net
    ports:
      - "80:80"
      - "443:443"
    expose:
      - "2019"
    logging: *logging
    mem_reservation: 64m
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - API_DOMAIN=${API_DOMAIN:-api.spaceship.dev}
      - DASHBOARD_DOMAIN=${DASHBOARD_DOMAIN:-dashboard.spaceship.dev}
      - ADMIN_DOMAIN=${ADMIN_DOMAIN:-admin.spaceship.dev}
      - STOREFRONT_DOMAIN=${STOREFRONT_DOMAIN:-spaceship.dev}
      - STOREFRONT_FOOD_DOMAIN=${STOREFRONT_FOOD_DOMAIN:-food.spaceship.dev}
    depends_on:
      - backend
      - dashboard
      - landing
      - storefront
      - storefront-food
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
        max_attempts: 3

networks:
  spaceship_net:
    name: spaceship_net
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
